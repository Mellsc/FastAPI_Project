services:

  fastzero_database:

    image: postgres:18

    volumes:
      - fastzero_pgdata_new:/var/lib/postgresql

    environment:
      POSTGRES_USER: app_user
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: app_password

    ports:
      - "5432:5432"

  fastzero_app:

    image: fastzero_app
    entrypoint: ./entrypoint.sh
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - fastzero_database

    environment:
      DATABASE_URL: postgresql+psycopg://app_user:app_password@fastzero_database:5432/app_db

volumes:
  fastzero_pgdata_new:
    external: true
    name: fastzero_pgdata_new
